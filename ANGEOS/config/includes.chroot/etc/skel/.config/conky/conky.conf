
conky.config = {
    background = true,
    update_interval = 2,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'top_right',
    gap_x = 25,
    gap_y = 45,
    minimum_width = 280,
    maximum_width = 320,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    default_color = 'FFFFFF',
    color1 = 'AAAAAA',
    color2 = '777777',
    uppercase = false,
    own_window_class = 'ANGEOS-Conky',
};

conky.text = [[
${color1}================================
${color}          ANGEOS / SYSTEM
${color1}================================

${color}PROCESSEUR
${color1}CPU : ${color}${cpu}% 
${color1}${cpubar 8}

${color}MEMOIRE
${color1}RAM : ${color}${mem} / ${memmax}
${color1}UTILISATION : ${color}${memperc}%
${color1}${membar 8}

${color}SYSTEME
${color1}HOTE : ${color}${nodename}
${color1}KERNEL : ${color}${kernel}
${color1}UPTIME : ${color}${uptime}

${color}RESEAU
${color1}IP : ${color}${execi 10 hostname -I | awk '{print $1}'}
${color1}INTERFACE : ${color}${execi 10 ip -o route show default | awk '{print $5; exit}'}

${color}PROCESSUS
${color1}TOTAL : ${color}${processes}
${color1}EN COURS : ${color}${running_processes}

${color}TOP CPU
${color1}${top name 1}${alignr}${top cpu 1}%
${color1}${top name 2}${alignr}${top cpu 2}%
${color1}${top name 3}${alignr}${top cpu 3}%

${color1}================================
${alignc}${color}ANGEOS LIVE SYSTEM
]]
